name: Studio tests
on:
  push:
    branches: [main, 'fix/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    name: CPU checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: multitalk-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Compile, units, offline reuse, and API checks
        run: python tests/run.py gate units reuse api
      - name: Install browser test dependencies
        if: matrix.python == '3.10'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser checks, including explicit Recheck versus polling
        if: matrix.python == '3.10'
        run: python tests/run.py ui
